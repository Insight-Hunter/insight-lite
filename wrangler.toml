name = "insight-hunter-lite-api"
main = "workers/index.ts"
compatibility_date = "2025-12-12"
account_id = "18c8e61a3669253dcfd0c7eec6be36a3"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

[vars]
ENVIRONMENT = "production"
API_VERSION = "v1"

[env.production]
name = "insight-hunter-lite-api"
vars = { ENVIRONMENT = "production" }
routes = [
  { pattern = "lite.insighthunter.app/*", zone_name = "insighthunter.app" }
]

[env.production.assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[env.staging]
name = "insight-hunter-lite-api-staging"
vars = { ENVIRONMENT = "staging" }

[env.development]
name = "insight-hunter-lite-api-dev"
vars = { ENVIRONMENT = "development" }

[build]
command = "npm run build && npm run build:worker"

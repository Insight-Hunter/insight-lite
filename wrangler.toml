# Cloudflare Workers Configuration for Insight Hunter Lite
# https://developers.cloudflare.com/workers/wrangler/configuration/

name = "insight-hunter-lite-api"
main = "workers/index.ts"
compatibility_date = "2025-12-12"
account_id = "" # Add your Cloudflare account ID here

# Workers Sites configuration (if needed for static assets)
# [site]
# bucket = "./dist"

# KV Namespaces for key-value storage
# [[kv_namespaces]]
# binding = "INSIGHTS_KV"
# id = "" # Add your KV namespace ID here
# preview_id = "" # Add your preview KV namespace ID here

# D1 Database bindings (Cloudflare's SQL database)
# [[d1_databases]]
# binding = "DB"
# database_name = "insight-hunter-db"
# database_id = "" # Add your D1 database ID here

# R2 Bucket bindings (object storage for files/exports)
# [[r2_buckets]]
# binding = "REPORTS_BUCKET"
# bucket_name = "insight-hunter-reports"

# Environment Variables
[vars]
ENVIRONMENT = "production"
API_VERSION = "v1"

# CORS configuration
[env.production]
name = "insight-hunter-lite-api"
vars = { ENVIRONMENT = "production" }

[env.staging]
name = "insight-hunter-lite-api-staging"
vars = { ENVIRONMENT = "staging" }

[env.development]
name = "insight-hunter-lite-api-dev"
vars = { ENVIRONMENT = "development" }

# Build configuration
[build]
command = "npm run build:worker"

# Routes configuration (uncomment to attach worker to specific routes)
# routes = [
#   { pattern = "api.insighthunter.com/*", zone_name = "insighthunter.com" }
# ]

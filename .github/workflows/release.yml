name: Release Insight Lite

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build installers
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22" # adjust to your project

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package installer
        run: npm run package:${{ matrix.target }}
        # e.g. package:windows, package:macos, package:linux in package.json

      - name: Generate checksum
        shell: bash
        run: |
          mkdir -p dist/checksums
          FILE=$(ls dist/*${{ matrix.target }}* | head -n 1)
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            certutil -hashfile "$FILE" SHA256 > "dist/checksums/${{ matrix.target }}.sha256"
          else
            shasum -a 256 "$FILE" > "dist/checksums/${{ matrix.target }}.sha256"
          fi

      # OPTIONAL: code signing steps per OS go here

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: insight-lite-${{ matrix.target }}
          path: |
            dist/*${{ matrix.target }}*
            dist/checksums/${{ matrix.target }}.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Gather release artifacts
        run: |
          ls -R dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Insight Lite ${{ github.ref_name }}
          body: |
            Insight Lite ${{ github.ref_name }}

            See CHANGELOG.md or the repository README for full details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
